# Advertise full terminal capabilities to programs running inside tmux
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Ghostty uses xterm-ghostty as its TERM; declare true-color support so tmux
# doesn't degrade color output when the outer terminal is Ghostty.
set -ga terminal-overrides ",xterm-ghostty:Tc"

# Refresh status line every second so process names update promptly
set -g status-interval 1

# Rename each window to its current foreground process automatically
setw -g automatic-rename on

# Flag windows where output has appeared since you last looked
setw -g monitor-activity on
set -g visual-activity off

# Window list: show index and process name; mark activity with *
set -g window-status-format ' #I:#W#{?window_activity_flag,*,} '
set -g window-status-current-format ' #I:#W '

# Current window: bold and reversed so it stands out
set -g window-status-current-style 'bold,reverse'

# Activity flag: solid yellow chip (black text on yellow bg)
set -g window-status-activity-style 'fg=black,bg=yellow,bold'

# Show session name on the left, current git branch on the right
set -g status-left "[#{session_name}] "
set -g status-right "#(git branch --show-current 2>/dev/null)"