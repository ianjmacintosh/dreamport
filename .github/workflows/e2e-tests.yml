name: End-to-End Tests
on:
  workflow_call:
jobs:
  test:
    name: Test with Playwright
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.58.1-noble
    env:
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      EMAIL_MODE: mock
      VITE_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Use pre-installed Chromium for miniflare browser binding
        run: |
          # Prefer the Playwright container's pre-installed Chromium over downloading Chrome-for-Testing
          CHROME_PATH=$(find "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}" -name chrome -type f 2>/dev/null | grep -v "headless\|inspector" | head -1)
          if [ -n "$CHROME_PATH" ]; then
            echo "MINIFLARE_CHROME_EXECUTABLE=$CHROME_PATH" >> "$GITHUB_ENV"
            echo "Using pre-installed Chromium: $CHROME_PATH"
          else
            echo "Pre-installed Chromium not found; miniflare will use Chrome-for-Testing (cached if available)"
          fi
      - name: Write .dev.vars for local Worker
        run: |
          # The Cloudflare Vite plugin reads .dev.vars (gitignored). A missing
          # BETTER_AUTH_SECRET repo secret falls back to a throwaway value —
          # fine because e2e runs entirely in EMAIL_MODE=mock and no session
          # outlives the run.
          printf 'BETTER_AUTH_SECRET=%s\nEMAIL_MODE=mock\nTURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA\n' \
            "${BETTER_AUTH_SECRET:-$(openssl rand -base64 32)}" > .dev.vars
      - name: Run Playwright tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
